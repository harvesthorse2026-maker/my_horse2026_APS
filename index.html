<title>觸角圖 精簡版</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
    --core:#0f766e; --corebg:#ecfdf5; --two:#7c3aed; --twobg:#f5f3ff; --wait:#9ca3af;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0b1220; --card:#111a2b; --ink:#e8eefc; --sub:#94a3b8; --line:#233049;
           --core:#34d399; --corebg:#0d2b23; --two:#a78bfa; --twobg:#1e1a3a; --wait:#64748b; }
  }
  *{box-sizing:border-box;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:10px 12px 28px}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;
         border-bottom:1px solid var(--line)}
  h1{font-size:19px;margin:0 0 2px}
  .meta{font-size:13px;color:var(--sub)}
  .race{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:12px 12px 14px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .rhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .rno{font-size:20px;font-weight:800;letter-spacing:.5px}
  .rname{font-size:16px;font-weight:700}
  .rinfo{font-size:12.5px;color:var(--sub)}
  .line{display:flex;align-items:flex-start;gap:8px;padding:7px 0}
  .line + .line{border-top:1px dashed var(--line)}
  .tag{flex:0 0 auto;min-width:56px;text-align:center;font-size:12.5px;font-weight:700;
       padding:5px 8px;border-radius:9px;white-space:nowrap}
  .tag.core{color:var(--core);background:var(--corebg);border:1px solid var(--core)}
  .tag.two{color:var(--two);background:var(--twobg);border:1px solid var(--two)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 auto}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px 6px 6px;
        border:1px solid var(--line);border-radius:999px;background:var(--bg)}
  .no{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;
      padding:0 5px;border-radius:999px;background:#1f2937;color:#fff;font-weight:800;font-size:14px}
  .nm{font-size:16.5px;font-weight:700;letter-spacing:.2px}
  .sq{font-size:11.5px;font-weight:800;color:#b45309;background:#fffbeb;
      border:1px solid #f59e0b;border-radius:6px;padding:1px 5px;white-space:nowrap}
  @media (prefers-color-scheme: dark){
    .sq{color:#fcd34d;background:#3a2a08;border-color:#b45309}
  }
  .wait{color:var(--wait);font-size:14px;padding:6px 0}
  footer{margin-top:18px;font-size:12px;color:var(--sub);line-height:1.6;
         border-top:1px solid var(--line);padding-top:10px}
  .legend{font-size:12.5px;color:var(--sub);margin:8px 0 0}
</style>
</head>

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function chips(list){
  if(!list || !list.length) return '<div class="wait">待填</div>';
  return '<div class="chips">' + list.map(h =>
    '<span class="chip"><span class="no">' + esc(h.no) + '</span><span class="nm">' + esc(h.nm) + '</span>' +
    (h.sq ? '<span class="sq">' + esc(h.sq) + '</span>' : '') + '</span>'
  ).join('') + '</div>';
}
function raceHtml(x){
  return '<section class="race">' +

      '<span class="rname">' + esc(x.name) + '</span>' +

    '<div class="line"><span class="tag core">核心 5</span>' + chips(x.core5) + '</div>' +
    '<div class="line"><span class="tag two">(2)</span>' + chips(x.two) + '</div>' +
  '</section>';
}
